name: Skill benchmark

# Runs the deterministic benchmark (trigger precision/recall + before/after
# violation-count quality score) on every PR that touches the skill or its
# target app, so a skill regression is caught before merge — not just
# discovered later by hand. See docs/04-evaluation-and-benchmarking.md.

on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - "app/**"
      - ".evals/**"
  workflow_dispatch: {}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git worktree` and skill_version() work

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run benchmark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 .evals/run_evals.py --repeat 2

      - name: Upload eval log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-log
          path: .evals/eval_log.csv
